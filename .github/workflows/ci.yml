name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GLUALINT_VERSION: "1.30.0"

jobs:
  lint:
    name: Lint (glualint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install glualint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/glualint.zip" \
            "https://github.com/FPtje/GLuaFixer/releases/download/${GLUALINT_VERSION}/glualint-${GLUALINT_VERSION}-x86_64-linux.zip"
          unzip -q -o "$RUNNER_TEMP/glualint.zip" -d "$RUNNER_TEMP/glualint"
          chmod +x "$RUNNER_TEMP/glualint/glualint"
          echo "$RUNNER_TEMP/glualint" >> "$GITHUB_PATH"

      - name: Lint
        run: glualint --output-format github lint gamemodes tests

  test:
    name: Tests (LuaJIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit -v

      - name: Unit and boot tests
        run: luajit tests/run.lua
